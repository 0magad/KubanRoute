[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kuban-route"
version = "0.1.0"
description = "Рекомендательная система мест для отдыха на Кубани"
requires-python = ">=3.10"
dependencies = [
    "supabase>=2.0.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
